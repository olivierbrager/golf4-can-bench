<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaxxECU Replay</title>
<style>
body{margin:0;background:#0b0f14;color:#f2f6fa;font-family:Arial,system-ui,sans-serif}header{position:sticky;top:0;background:#111a24;padding:12px;border-bottom:1px solid #26384d;z-index:2}button,select,input{font-size:18px;padding:12px;border-radius:10px;margin:4px;background:#1c2a3b;color:#fff;border:1px solid #456}button{min-width:130px}main{padding:12px}.card{background:#141f2b;border:1px solid #2a4057;border-radius:12px;padding:14px;margin:9px 0}.label{font-size:12px;color:#9fb0c3;text-transform:uppercase}.val{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}#debug{white-space:pre-wrap;color:#ffd166;font-size:13px}@media(max-width:520px){.grid{grid-template-columns:1fr}button,select{width:100%}}
</style>
</head>
<body>
<header>
  <b>MaxxECU Replay — test mobile</b><br>
  <small>Version GitHub Pages · extrait ralenti</small><br>
  <button id="play">▶ Lecture</button>
  <button id="step">+1 point</button>
  <button id="reset">Reset</button>
  <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>
</header>
<main>
  <div class="card"><div class="label">Position</div><input id="range" type="range" min="0" max="899" value="0" style="width:100%"></div>
  <div class="grid">
    <div class="card"><div class="label">Horodatage</div><div class="val" id="timestamp">—</div></div>
    <div class="card"><div class="label">Index / état</div><div class="val" id="state">—</div></div>
    <div class="card"><div class="label">RPM</div><div class="val" id="rpm">—</div></div>
    <div class="card"><div class="label">MAP</div><div class="val" id="map">—</div></div>
    <div class="card"><div class="label">TPS</div><div class="val" id="tps">—</div></div>
    <div class="card"><div class="label">Lambda</div><div class="val" id="lambda">—</div></div>
    <div class="card"><div class="label">IAT / CLT</div><div class="val" id="temp">—</div></div>
    <div class="card"><div class="label">Batterie</div><div class="val" id="batt">—</div></div>
  </div>
  <div class="card"><div class="label">Debug</div><div id="debug">Chargement...</div></div>
</main>
<script>
(function(){
var DATA=[];
for(var k=0;k<900;k++){
  DATA.push({timestamp:'17:'+String(37+Math.floor(k/600)).padStart(2,'0')+':'+String(Math.floor((k/10)%60)).padStart(2,'0')+'.'+String((k%10)*100).padStart(3,'0'),rpm:850+Math.round(Math.sin(k/19)*90),map:38+Math.sin(k/31)*4,tps:1.5+Math.sin(k/45)*0.8,lambda:1+Math.sin(k/55)*0.04,iat:26+Math.sin(k/80),clt:74+k*0.012,batt:13.7+Math.sin(k/70)*0.05});
}
var i=0,playing=false,timer=null;
function $(id){return document.getElementById(id)}
function val(x,dec){var n=Number(x);return isFinite(n)?n.toFixed(dec||0):'—'}
function render(){var d=DATA[i]||{};$('timestamp').textContent=d.timestamp||'—';$('state').textContent=i+' / '+(DATA.length-1)+(playing?' ▶':' ❚❚');$('rpm').textContent=val(d.rpm,0);$('map').textContent=val(d.map,1)+' kPa';$('tps').textContent=val(d.tps,1)+' %';$('lambda').textContent=val(d.lambda,3);$('temp').textContent=val(d.iat,1)+' / '+val(d.clt,1)+' °C';$('batt').textContent=val(d.batt,2)+' V';$('range').value=i;}
function tick(){if(!playing)return;i++;if(i>=DATA.length){i=DATA.length-1;stop();return;}render();}
function start(){stop(false);playing=true;$('play').textContent='⏸ Pause';var spd=Number($('speed').value)||1;var ms=Math.max(20,100/spd);timer=setInterval(tick,ms);$('debug').textContent='Lecture démarrée. Timer='+ms+' ms. Données embarquées='+DATA.length+' points.';render();}
function stop(update){if(timer){clearInterval(timer);timer=null;}playing=false;$('play').textContent='▶ Lecture';if(update!==false)render();}
$('play').onclick=function(e){e.preventDefault();playing?stop():start();};
$('step').onclick=function(e){e.preventDefault();stop(false);i=Math.min(DATA.length-1,i+1);render();$('debug').textContent='Step manuel OK';};
$('reset').onclick=function(e){e.preventDefault();stop(false);i=0;render();$('debug').textContent='Reset OK';};
$('range').oninput=function(e){stop(false);i=Number(e.target.value)||0;render();$('debug').textContent='Curseur OK index='+i;};
window.onerror=function(msg,src,line){$('debug').textContent='JS ERROR: '+msg+' ligne '+line;};
$('debug').textContent='JS chargé. Appuie sur +1 point puis Lecture.';render();
})();
</script>
</body>
</html>

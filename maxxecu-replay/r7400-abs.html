<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaxxECU r7400 abs</title><style>body{margin:0;background:#090d12;color:#eaf1f8;font-family:system-ui,Arial}header{position:sticky;top:0;background:#09101a;border-bottom:1px solid #26384d;padding:12px;z-index:2}button,select{font-size:18px;padding:12px;border-radius:12px;background:#182435;color:#fff;border:1px solid #3a506c;margin:4px}main{padding:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#121a24;border:1px solid #26384d;border-radius:14px;padding:12px;margin-bottom:8px}.lab{color:#8ca0b7;font-size:11px;text-transform:uppercase}.val{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}.charts{display:grid;grid-template-columns:1fr 1fr;gap:8px}canvas{width:100%;height:230px;background:#07101a;border:1px solid #1f3043;border-radius:12px}#info{color:#ffd166;white-space:pre-wrap}@media(max-width:800px){.grid,.charts{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.charts{grid-template-columns:1fr}button,select{width:100%}}</style></head><body><header><b>MaxxECU Replay 7400 — realtime absolu</b><br><small>1x = 120 secondes réelles si dataset 7400 chargé</small><br><button id="play">▶ Lecture</button><select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x réel</option><option value="2">2x</option><option value="4">4x</option><option value="8">8x</option></select><button id="reset">Reset</button></header><main><div class="grid"><div class="card"><div class="lab">Temps</div><div class="val" id="t">—</div></div><div class="card"><div class="lab">Index</div><div class="val" id="idx">—</div></div><div class="card"><div class="lab">RPM</div><div class="val" id="rpm">—</div></div><div class="card"><div class="lab">MAP</div><div class="val" id="map">—</div></div><div class="card"><div class="lab">TPS</div><div class="val" id="tps">—</div></div><div class="card"><div class="lab">Lambda</div><div class="val" id="lambda">—</div></div><div class="card"><div class="lab">CLT</div><div class="val" id="clt">—</div></div><div class="card"><div class="lab">Batterie</div><div class="val" id="bat">—</div></div></div><input id="slider" type="range" min="0" max="0" value="0" style="width:100%;margin:10px 0"><div class="charts"><div class="card"><canvas id="c1" width="900" height="300"></canvas></div><div class="card"><canvas id="c2" width="900" height="300"></canvas></div></div><div class="card"><div class="lab">Diagnostic</div><div id="info">Chargement...</div></div></main><script>(function(){var URL='https://olivierbrager.github.io/golf4-can-bench/maxxecu-replay/maxxecu_120_original_sampling.html?v=7400abs3';var D=[],i=0,playing=false,startWall=0,startLog=0,lastDraw=0;var $=id=>document.getElementById(id);function n(x){return Number(x)||0}function f(x,d){x=Number(x);return isFinite(x)?x.toFixed(d||0):'—'}function byTime(t){var lo=0,hi=D.length-1;while(lo<hi){var m=(lo+hi)>>1;if(n(D[m].t)<t)lo=m+1;else hi=m}return lo}function render(force){if(!D.length)return;var d=D[i];$('t').textContent=f(d.t,3)+' s';$('idx').textContent=i+' / '+(D.length-1);$('rpm').textContent=f(d.rpm,0);$('map').textContent=f(d.map,1);$('tps').textContent=f(d.tps,1);$('lambda').textContent=f(d.lambda,3);$('clt').textContent=f(d.clt,1);$('bat').textContent=f(d.bat,2);$('slider').value=i;var now=performance.now();if(force||now-lastDraw>200){draw('c1',[['rpm','RPM',0,3500],['map','MAP',0,120],['tps','TPS',0,100]]);draw('c2',[['lambda','Lambda',.7,1.5],['lt','LT',.7,1.2],['lc','LC',-30,30]]);lastDraw=now}}function draw(id,S){var c=$(id),x=c.getContext('2d'),w=c.width,h=c.height,cols=['#77c7ff','#ffd166','#56d68a'];x.clearRect(0,0,w,h);S.forEach(function(s,k){x.strokeStyle=cols[k%3];x.fillStyle=cols[k%3];x.fillText(s[1],40+k*110,16);x.beginPath();for(var j=0;j<D.length;j+=2){var v=n(D[j][s[0]]),xx=35+j*(w-50)/(D.length-1),yy=h-20-((v-s[2])/(s[3]-s[2]))*(h-45);if(j===0)x.moveTo(xx,yy);else x.lineTo(xx,yy)}x.stroke()});var xc=35+i*(w-50)/(D.length-1);x.strokeStyle='#fff';x.beginPath();x.moveTo(xc,20);x.lineTo(xc,h-15);x.stroke()}function loop(now){if(playing){var sp=n($('speed').value)||1;var target=startLog+(now-startWall)/1000*sp;i=byTime(target);if(i>=D.length-1){i=D.length-1;playing=false;$('play').textContent='▶ Lecture'}render(false)}requestAnimationFrame(loop)}$('play').onclick=function(){if(!D.length)return;if(playing){playing=false;$('play').textContent='▶ Lecture';return}playing=true;startWall=performance.now();startLog=n(D[i].t);$('play').textContent='⏸ Pause';render(true)};$('reset').onclick=function(){playing=false;$('play').textContent='▶ Lecture';i=0;render(true)};$('slider').oninput=function(){playing=false;$('play').textContent='▶ Lecture';i=n(this.value);render(true)};window.onerror=function(m,s,l){$('info').textContent='Erreur JS: '+m+' ligne '+l};fetch(URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(txt=>{var a=txt.indexOf('var D=['),b=txt.indexOf('];var base=',a);if(a<0||b<0)throw Error('D introuvable dans source');D=JSON.parse(txt.slice(a+6,b+1));$('slider').max=D.length-1;$('info').textContent='OK dataset chargé: '+D.length+' points, durée '+f(D[D.length-1].t,3)+' s. À 1x, la lecture doit durer environ '+f(D[D.length-1].t,0)+' s.';render(true);requestAnimationFrame(loop)}).catch(e=>{$('info').textContent='ECHEC chargement dataset: '+e.message+'\nURL: '+URL});})();</script></body></html>
